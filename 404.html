<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lost in the static · Glitchlings</title>
<link rel="icon" type="image/png" href="/glitchlings-site/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/glitchlings-site/style.css">
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px 220px; }
  .lost .inner { display: grid; gap: 18px; justify-items: center; }
  .lost .sprite { --s: 160px; --n: 16; --ms: 150ms; background-image: url(/glitchlings-site/img/sprites/duskit_idle.png); }
</style>
</head>
<body>
<section class="hero lost">
  <div class="sky" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="inner">
    <div class="sprite" role="img" aria-label="Duskit, a shadow kitten, looking at you"></div>
    <p class="eyebrow">404</p>
    <h1 style="font-size:clamp(2.2rem,6vw,3.4rem)">Lost in the static</h1>
    <p class="lede">This page wandered off. Duskit says it was never here at all.</p>
    <a class="btn btn-primary" href="/glitchlings-site/">Back home</a>
  </div>
</section>
</body>
</html>
